name: Discord yayın bildirimi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bildirilecek sürüm etiketi (örn. v1.0.9)"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Yayın bilgisini oku
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,body,url > release.json

      - name: Discord kanalına gönder
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          TAG=$(jq -r .tagName release.json)
          URL=$(jq -r .url release.json)
          # Yayın notundaki her dolu satır bir madde olur.
          BULLETS=$(jq -r '.body' release.json | sed -e '/^[[:space:]]*$/d' -e 's/^/▸ /')
          DESC=$(printf 'Bu sürümde neler değişti?\n\n%s' "$BULLETS")
          jq -n \
            --arg title "MDPack $TAG hazır" \
            --arg url "$URL" \
            --arg desc "$DESC" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "MDPack",
              embeds: [{
                author: {name: "MDPack · yeni sürüm"},
                title: $title,
                url: $url,
                description: ($desc | .[:3800]),
                color: 26367,
                fields: [{name: "Nasıl güncellenir?", value: "Uygulamayı aç. Yeni sürüm göründüğünde **Güncelle** düğmesine bas; MDPack kendini yeniden başlatır."}],
                footer: {text: "MDPack · Windows optimizasyon aracı"},
                timestamp: $time
              }]
            }' > payload.json
          WEBHOOK=$(printf '%s' "$DISCORD_WEBHOOK_URL" | sed 's/^\xef\xbb\xbf//' | tr -d '\r\n[:space:]')
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d @payload.json "$WEBHOOK")
          echo "Discord yanıtı: $STATUS"
          test "$STATUS" = "204"
